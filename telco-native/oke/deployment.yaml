apiVersion: apps/v1
kind: Deployment
metadata:
  name: telco-native
  namespace: telco-native
  labels:
    app.kubernetes.io/name: telco-native
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telco-native
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telco-native
    spec:
      serviceAccountName: telco-native
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: telco-native-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: telco-native-config
            - secretRef:
                name: telco-native-runtime
          volumeMounts:
            - name: adb-wallet
              mountPath: /opt/oracle/wallet
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: adb-wallet
          secret:
            secretName: telco-adb-wallet
