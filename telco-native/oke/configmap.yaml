apiVersion: v1
kind: ConfigMap
metadata:
  name: telco-native-config
  namespace: telco-native
data:
  NODE_ENV: production
  PORT: "3001"
  FRONTEND_URL: ""
  ORACLE_USER: LIVESTACK_NATIVE
  ORACLE_CONNECTION_STRING: genaivasuatp_medium
  ORACLE_WALLET_LOCATION: /opt/oracle/wallet
  ORACLE_POOL_MIN: "2"
  ORACLE_POOL_MAX: "10"
  ORACLE_POOL_INCREMENT: "1"
  OCI_GENAI_BASE_URL: "REPLACE_WITH_OCI_GENAI_ENDPOINT"
  OCI_GENAI_MODEL: "REPLACE_WITH_MODEL_ID"
  OCI_GENAI_PROJECT_OCID: "REPLACE_WITH_PROJECT_OCID"
  OCI_GENAI_TIMEOUT_MS: "60000"
  OCI_GENAI_JSON_MAX_TOKENS: "1024"
  OCI_GENAI_TEXT_MAX_TOKENS: "768"
  DEMO_USAGE_COUNTER_ENABLED: "false"
